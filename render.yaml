# Render blueprint for a free staging API (DEV-37). Secrets are set in the dashboard:
# DATABASE_URL is entered by hand (never committed); JWT_SECRET is generated by Render.
services:
  - type: web
    name: curiosity-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # The free plan has no pre-deploy step, so migrations run before the server starts.
    dockerCommand: >-
      sh -c "alembic upgrade head &&
      uvicorn --factory app.main:create_app --host 0.0.0.0 --port $PORT --proxy-headers --workers 1"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: fake
      - key: DB_POOL_SIZE
        value: "5"
      - key: LOG_LEVEL
        value: INFO
