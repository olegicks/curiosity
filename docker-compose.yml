# Local development: PostgreSQL + API with live reload.
#   docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: curiosity
      POSTGRES_PASSWORD: curiosity
      POSTGRES_DB: curiosity
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./apps/api/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curiosity -d curiosity"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://curiosity:curiosity@db:5432/curiosity
      TEST_DATABASE_URL: postgresql+psycopg://curiosity:curiosity@db:5432/curiosity_test
    volumes:
      - ./apps/api:/app
      - /app/.venv
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
