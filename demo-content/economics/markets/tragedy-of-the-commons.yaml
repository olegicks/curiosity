steps:
- type: hook
  body: |
    Every fishing boat gains by catching one more fish. But if every boat does the
    same, the fish run out for everyone. Who's to blame?
- type: explanation
  title: The core idea
  body: |
    The **tragedy of the commons** happens when a resource is shared and open to
    all. Each user gets the full benefit of taking more but shares the cost with
    everyone, so the resource gets overused, even when everyone would be better off
    holding back.
- type: question
  question_key: check-why
- type: example
  kind: research
  source_key: ostrom-1990
  title: Communities that manage the commons
  body: |
    The political scientist Elinor Ostrom studied fisheries, forests and pastures
    around the world. Many communities avoided the tragedy with their own rules:
    clear boundaries, shared monitoring and fair penalties.
- type: misconception
  myth: Shared resources are always doomed unless they're privatised.
  correction: |
    Ostrom showed many communities manage shared resources well for centuries
    through local rules. Privatisation and regulation are not the only answers.
- type: question
  question_key: check-tf
- type: summary
  points:
  - Open, shared resources tend to be overused.
  - Each user gains fully but shares the cost.
  - Clear rules, monitoring and fair penalties can protect commons.
questions:
- key: check-why
  role: lesson
  type: single_choice
  prompt: Why does each fisher keep fishing even as stocks fall?
  options:
  - key: a
    text: They get all the benefit of their catch but share the cost of depletion
    correct: true
    feedback: Individual gain, shared loss.
  - key: b
    text: Fishers don't care about the future
    correct: false
    feedback: Even caring fishers face this trap.
  - key: c
    text: Fish breed faster when caught
    correct: false
    feedback: Overfishing reduces stocks.
  explanation: Benefits are private; costs are shared.
- key: check-tf
  role: lesson
  type: true_false
  prompt: 'True or false: Elinor Ostrom found that communities can manage shared resources without outside
    control.'
  options:
  - key: 'true'
    text: 'True'
    correct: true
    feedback: Right. Clear rules, monitoring and fair penalties worked in many places.
  - key: 'false'
    text: 'False'
    correct: false
    feedback: Ostrom documented many communities that did exactly that.
  explanation: Local rules can solve the tragedy.
- key: recall-1
