name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: curiosity
          POSTGRES_PASSWORD: curiosity
          POSTGRES_DB: curiosity_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U curiosity -d curiosity_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://curiosity:curiosity@localhost:5432/curiosity_test
      TEST_DATABASE_URL: postgresql+psycopg://curiosity:curiosity@localhost:5432/curiosity_test
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-0000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run curiosity content validate
      - run: uv run curiosity content import
      - run: uv run pytest --cov --cov-report=term-missing

  api-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile --target runtime -t curiosity-api:ci .
